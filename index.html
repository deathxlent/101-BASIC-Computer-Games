<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>101 BASIC Computer Games - HTML Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff00;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            border: 2px solid #00ff00;
            background: #111;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00ff00;
        }

        .subtitle {
            color: #00cc00;
            font-size: 1.1em;
        }

        .stats {
            margin-top: 15px;
            font-size: 0.9em;
            color: #00aa00;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: #111;
        }

        th {
            background: #003300;
            color: #00ff00;
            padding: 12px 15px;
            text-align: left;
            border: 1px solid #00ff00;
            font-weight: bold;
            position: sticky;
            top: 0;
        }

        td {
            padding: 10px 15px;
            border: 1px solid #004400;
        }

        tr:nth-child(even) {
            background: #0a0a0a;
        }

        tr:hover {
            background: #002200;
        }

        .game-name {
            font-weight: bold;
        }

        a {
            color: #00ffff;
            text-decoration: none;
            padding: 4px 10px;
            border: 1px solid #00ffff;
            transition: all 0.3s;
        }

        a:hover {
            background: #00ffff;
            color: #000;
        }

        a.basic-link {
            color: #ffff00;
            border-color: #ffff00;
        }

        a.basic-link:hover {
            background: #ffff00;
            color: #000;
        }

        .status-done {
            color: #00ff00;
        }

        .status-pending {
            color: #666;
        }

        .scroll-indicator {
            text-align: center;
            color: #006600;
            margin-top: 10px;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.5em;
            }
            th, td {
                padding: 8px 5px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>101 BASIC COMPUTER GAMES</h1>
            <p class="subtitle">HTML Edition - Classic Games from the 1970s</p>
            <p class="stats">Total Games: 101 | Ported: <span id="ported-count">5</span></p>
        </header>

        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Game Name</th>
                    <th>HTML Version</th>
                    <th>Original BASIC</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="game-list">
            </tbody>
        </table>

        <p class="scroll-indicator">↑ Scroll to see all games ↑</p>
    </div>

        ];

        const tbody = document.getElementById('game-list');
        let portedCount = 0;

        games.forEach((game, index) => {
            const row = document.createElement('tr');
            const htmlLink = game.ported 
                ? `<a href="games/${game.name}.html">Play</a>`
                : `<span style="color: #444;">Coming Soon</span>`;
            
            if (game.ported) portedCount++;

            row.innerHTML = `
                <td>${index + 1}</td>
                <td class="game-name">${game.name.toUpperCase()}</td>
                <td>${htmlLink}</td>
                <td><a href="maurymarkowitz/101-BASIC-Computer-Games/${game.file}" class="basic-link" target="_blank">View Code</a></td>
                <td class="${game.ported ? 'status-done' : 'status-pending'}">${game.ported ? '✓ PORTED' : '○ PENDING'}</td>
            `;
            tbody.appendChild(row);
        });

        document.getElementById('ported-count').textContent = portedCount;
